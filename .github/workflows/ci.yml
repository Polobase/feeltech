name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Build first: each package resolves its `@freqgen/*` deps through the
      # workspace symlink to the dependency's built `dist/` (its package.json
      # `types`/`exports` point there), so typecheck, tests and check:package
      # all need `dist/` to exist. Workspaces build in dependency order.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
